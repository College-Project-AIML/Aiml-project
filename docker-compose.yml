
services:
  # 1. PostgreSQL (Users, Auth, Structured Data)
  postgres:
    image: postgres:15-alpine
    container_name: aiml_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-aiml_core}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aiml_net

  # 2. MongoDB (Schemes, Unstructured Data)
  mongo:
    image: mongo:6.0
    container_name: aiml_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-securepassword}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_v2:/data/db  
    networks:
      - aiml_net

  # 3. Qdrant (Vector Database for RAG/AI)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiml_qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - aiml_net

  # 4. Redis (Caching & Task Queues)
  redis:
    image: redis:alpine
    container_name: aiml_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - aiml_net

# Persist data so it doesn't vanish when you restart containers
volumes:
  postgres_data:
  mongo_data_v2: 
  qdrant_data:

networks:
  aiml_net:
    driver: bridge